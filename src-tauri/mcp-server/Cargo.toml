[package]
name = "orion-mcp"
version = "0.6.7"
description = "Local read-write MCP server for the Orion knowledge atlas"
authors = ["Orion"]
edition = "2021"
publish = false

[dependencies]
base64 = "0.22.1"
fs2 = "0.4"
num-bigint = "0.4.8"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ryu-js = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "=2.5.8"

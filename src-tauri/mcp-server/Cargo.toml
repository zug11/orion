[package]
name = "orion-mcp"
version = "0.5.2"
description = "Local read-write MCP server for the Orion knowledge atlas"
authors = ["Orion"]
edition = "2021"
publish = false

[dependencies]
fs2 = "0.4"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
dirs = "6"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

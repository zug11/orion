name: Windows installer

on:
  push:
    branches: [codex/orion-windows]
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'script/**', '.github/workflows/windows.yml', 'package*.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/windows/release/build
            target/windows/release/deps
            target/windows/release/.fingerprint
          key: orion-windows-x64-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: cargo clean --release -p orion --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis --ci
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      - run: npm test -- --maxWorkers=2
      - name: Verify installed app
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem target/windows/release/bundle/nsis/*-setup.exe)
          if ($setup.Length -ne 1) { throw 'Expected exactly one installer.' }
          ./script/test_windows_installer.ps1 -Installer $setup[0].FullName
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/orion-smoke-failure.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: orion-windows-x64
          path: target/windows/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

name: Windows installer

on:
  push:
    branches: [codex/orion-windows]
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'script/**', '.github/workflows/windows.yml', 'package*.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/windows/release/build
            target/windows/release/deps
            target/windows/release/.fingerprint
          key: orion-windows-x64-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: cargo clean --release -p orion --manifest-path src-tauri/Cargo.toml
      - name: Verify and stage the speech runtime
        run: node script/stage_windows_transcription.mjs
        timeout-minutes: 5
      - name: Build the Windows renderer
        run: npm run build
      - name: Compile and package Orion
        shell: pwsh
        run: |
          $override = Join-Path $env:RUNNER_TEMP 'orion-staged-build.json'
          Set-Content -LiteralPath $override -Value '{"build":{"beforeBuildCommand":""}}' -Encoding utf8NoBOM
          npm run tauri build -- --bundles nsis --ci --config $override
      - run: git diff --exit-code
      - uses: actions/cache/save@v5
        if: steps.rust-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/windows/release/build
            target/windows/release/deps
            target/windows/release/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: orion-windows-x64
          compression-level: 0
          path: target/windows/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Verify installed app
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem target/windows/release/bundle/nsis/*-setup.exe)
          if ($setup.Length -ne 1) { throw 'Expected exactly one installer.' }
          ./script/test_windows_installer.ps1 -Installer $setup[0].FullName
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib
      - run: npm test -- --maxWorkers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/orion-smoke-failure.png
          if-no-files-found: ignore
